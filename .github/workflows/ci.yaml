# ci.yaml — PR gate: the agent-base image must still BUILD. A dep/lock bump that breaks the build is
# caught HERE, on the PR, instead of on the master push that ships it. This is the required status check
# `ci` that gates the merge path (renovate auto-merge + update-pr-branch, FU-014/FU-041) — without a
# PR-triggered check, an armed PR could never see green and the updater would never bring it current.
#
# No push: build-image.yaml owns the ghcr push on master; this is a no-push verification build on the
# same ARC tier (homelab-ephemeral), so it exercises the real Dockerfile + devbox/nix toolchain resolve.
name: CI

on:
  pull_request:
  workflow_dispatch:

# One live run per PR (org standard — homelab docs/ci.md §Concurrency, from oracle-fleet#222):
# a superseded PR head's run cancels instead of queuing; push/master runs keep their own serial
# group and never cancel (a cancelled push run can leave a publish half-written).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: homelab-ephemeral
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # The carved-out dep-bump lane's replacement owner (CODEOWNERS un-owns
      # agent-base/devbox.{json,lock}; this asserts such a PR is a pure version/hash diff).
      # gh comes baked in the ARC runner image (homelab docker/arc-runner/).
      - name: deps-pin-guard (carved-out dep lane)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GUARD_SET: agent-base/devbox.json agent-base/devbox.lock
        run: sh scripts/deps-pin-guard.sh
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build agent-base image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: agent-base/Dockerfile
          platforms: linux/amd64
          push: false

      # pin-only-lint (homelab ADR-100 addendum, S9 #1990): the `.github/workflows` pin gate. Runs
      # homelab's MASTER script (sparse checkout) — a fix there reaches every caller at once. The
      # lint allows only verified action pin bumps (`uses: owner/repo@sha # tag`, SHA resolved
      # upstream to the tag's commit) in workflow files; any other workflow edit takes the
      # operator path to master, where this check does not run. This is what replaces the code
      # owner on /.github/workflows/ (CODEOWNERS) — a rule stricter than the review it stands in for.
      - name: Fetch homelab's pin-only-lint at master
        if: github.event_name == 'pull_request'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: teststuffstash/homelab
          ref: master
          path: .homelab-lint
          sparse-checkout: |
            scripts/pin-only-lint.sh
            devbox.json
            devbox.lock
          sparse-checkout-cone-mode: false

      - name: Guarded files may only receive pin bumps (pin-only-lint)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PIN_ONLY_REPO: ${{ github.workspace }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          devbox run --config "$GITHUB_WORKSPACE/.homelab-lint" -- bash "$GITHUB_WORKSPACE/.homelab-lint/scripts/pin-only-lint.sh" "$BASE_SHA"

  # The image building says nothing about whether the harness LOGIC is right — agent-finalize
  # decides whether a model is struck and whether a round is re-dispatched, and two of its bugs
  # shipped green under a build-only gate. Unit tests, hermetic: no network, no cluster, no gh.
  unit:
    runs-on: homelab-ephemeral
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: "true"
      - name: devbox run ci
        run: devbox run ci
