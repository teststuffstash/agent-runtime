# ci.yaml — PR gate: the agent-base image must still BUILD. A dep/lock bump that breaks the build is
# caught HERE, on the PR, instead of on the master push that ships it. This is the required status check
# `ci` that gates the merge path (renovate auto-merge + update-pr-branch, FU-014/FU-041) — without a
# PR-triggered check, an armed PR could never see green and the updater would never bring it current.
#
# No push: build-image.yaml owns the ghcr push on master; this is a no-push verification build on the
# same ARC tier (homelab-ephemeral), so it exercises the real Dockerfile + devbox/nix toolchain resolve.
name: CI

on:
  pull_request:
  workflow_dispatch:

# One live run per PR (org standard — homelab docs/ci.md §Concurrency, from oracle-fleet#222):
# a superseded PR head's run cancels instead of queuing; push/master runs keep their own serial
# group and never cancel (a cancelled push run can leave a publish half-written).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: homelab-ephemeral
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # The carved-out dep-bump lane's replacement owner (CODEOWNERS un-owns
      # agent-base/devbox.{json,lock}; this asserts such a PR is a pure version/hash diff).
      # gh comes baked in the ARC runner image (homelab docker/arc-runner/).
      - name: deps-pin-guard (carved-out dep lane)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GUARD_SET: agent-base/devbox.json agent-base/devbox.lock
        run: sh scripts/deps-pin-guard.sh
      - uses: docker/setup-buildx-action@v3
      - name: Build agent-base image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent-base/Dockerfile
          platforms: linux/amd64
          push: false

  # The image building says nothing about whether the harness LOGIC is right — agent-finalize
  # decides whether a model is struck and whether a round is re-dispatched, and two of its bugs
  # shipped green under a build-only gate. Unit tests, hermetic: no network, no cluster, no gh.
  unit:
    runs-on: homelab-ephemeral
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: jetify-com/devbox-install-action@v0.13.0
        with:
          enable-cache: "true"
      - name: devbox run ci
        run: devbox run ci
